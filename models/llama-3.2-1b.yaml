# Llama-3.2-1B — import target for pretrained fine-tuning
#
# Every model scalar below is transcribed from the HuggingFace checkpoint's
# config.json. They must not drift: `compute_model_config_hash` gates
# `--resume`, so the config that imports the weights is the config that trains
# them.
#
# Dense GQA attention (no MLA, no MoE, no Mamba), NO QK norm, tied embeddings,
# BF16 on disk.
#
# Usage:
#   oxidizr import -f models/llama-3.2-1b.yaml \
#     -m /path/to/llama-3.2-1b -d <tokenized.bin>
#   oxidizr train -f models/llama-3.2-1b.yaml -d <tokenized.bin> \
#     --dtype bf16 --resume ./checkpoints/llama-3.2-1b/<imported>.safetensors

model:
  name: llama-3.2-1b

  hidden_size: 2048
  num_layers: 16
  num_heads: 32

  # 32 * 64 == 2048, so the fallback would agree; stated anyway because
  # config.json states it, and the two must not silently diverge.
  head_dim: 64

  # GQA: 8 KV heads shared across 32 query heads.
  kv_heads: 8

  # MLA off — dense attention is what the checkpoint's q/k/v/o projections are.
  kv_latent_dim: null
  q_latent_dim: null
  d_rope: null

  # MoE off — the checkpoint's FFN is a dense SwiGLU MLP.
  num_experts: null
  experts_per_tok: null
  shared_expert_enabled: null
  intermediate_size: 8192

  # No Mamba layers: every layer is attention.
  mamba_layers: null

  # OFF for Llama 3.2 — unlike Qwen3, its checkpoint carries no
  # `self_attn.q_norm.weight` / `k_norm.weight`. Turning it on here would make
  # the model expect two tensors per layer the source does not have, and the
  # import would hard-error naming them.
  qk_norm: false

  # LoRA is not optional at this size on a consumer GPU — it is the only
  # thing that fits. Every trainable parameter costs 16 bytes in steady state, even
  # at bf16: 2 for the weight, 2 for the gradient, and 12 for the optimizer.
  # AdamW keeps its state and an F32 MASTER COPY of every parameter narrower
  # than F32 (4 + 4 + 4), because a bf16 weight cannot absorb its own update —
  # at lr 2e-5 the relative step is ~0.1%, below bf16's ~0.4% resolution, so
  # `w + dw` rounds back to `w` and the run reports a loss while training
  # nothing. Full fine-tuning this 1.2B model is therefore 2.4 GB weights +
  # 2.4 gradients + 14.4 optimizer = 19.2 GB before a single activation.
  #
  # Under LoRA only the adapters reach the optimizer: 128 small tensors here,
  # so the 16 bytes apply to almost nothing. The frozen base costs its 2 bytes
  # per parameter and nothing else — no gradient, no master, no moments.
  #
  # LoRA freezes the base, so the base contributes no gradient and no optimizer
  # state — only the adapters do.
  lora:
    rank: 16
    alpha: 32.0
    target_modules: [q_proj, k_proj, v_proj, o_proj]
    # freeze_base defaults to true: every parameter that is not a lora_a/lora_b
    # factor is frozen, so only the adapters carry a gradient and AdamW state.
    # train_modules names path segments to keep trainable anyway, e.g.
    # [embed_tokens] for a grow_vocab run whose new rows start random. An entry
    # matching no parameter is a hard error, and it matches one whole
    # dot-separated segment — `norm` hits `norm.weight`, not
    # `input_layernorm.weight`.

  # lm_head shares embed_tokens' matrix, so the checkpoint has no separate
  # `lm_head.weight` to load.
  tie_word_embeddings: true

  vocab_size: 128256
  tokenizer_vocab: llama3

  # The loss layer materializes [batch, seq, vocab] logits, so sequence length
  # multiplies a vocab-sized tensor and is the knob that decides whether a run
  # fits. Changing it changes the config hash — re-import before training, not
  # after.
  max_seq_len: 512
  rope_theta: 500000.0

  # The checkpoint's on-disk precision. An F32 load doubles resident weights
  # for no pretrained information.
  dtype: bf16

trainer:
  target_device: gpu
  learning_rate: 0.00002
  max_steps: 0
  num_epochs: 1
  batch_size: 1
  gradient_accumulation: 8
  # Its own directory, not shared with qwen3-1.7b: `--resume auto` reads a
  # single `checkpoint_step_N.meta.json` per directory, so two models writing
  # to one directory leave the second import's metadata pointing at whichever
  # ran last.
  checkpoint_dir: "./checkpoints/llama-3.2-1b"
  log_interval: 1
  save_interval: 100
  max_checkpoints: 3
  load_balance_alpha: 0.0

  max_grad_norm: 1.0
  target_grad_norm: null
  max_grad_value: null

  adamw_beta1: 0.9
  adamw_beta2: 0.95
  adamw_eps: 0.000001
  weight_decay: 0.1

  warmup_steps: null
  warmup_ratio: null

  seed: 42

  group_size: 4
  beta_kl: 0.04
