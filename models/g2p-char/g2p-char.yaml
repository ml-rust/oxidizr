# g2p-char: character-level grapheme-to-phoneme model.
#
# Decoder-only transformer with dense attention and tied embeddings. The
# vocab holds special tokens, graphemes and phonemes. Each training sequence
# is `<bos> <us|gb> graphemes <sep> phonemes <eos>`, and only the phonemes
# and `<eos>` are scored.
#
# Build the dataset with boostr-audio's `assets/g2p_lm/build_dataset.py
# --row-tokens 129`, then train:
#   cargo run --release --features cuda -- train \
#     -f models/g2p-char/g2p-char.yaml \
#     -d $BOOSTR_MODELS_DIR/g2p_lm/data/train.bin

model:
  name: g2p-char

  hidden_size: 384
  num_layers: 6
  num_heads: 6
  head_dim: 64

  # Multi-head attention: every head has its own keys and values.
  kv_heads: null

  kv_latent_dim: null
  q_latent_dim: null
  d_rope: null

  num_experts: null
  experts_per_tok: null
  shared_expert_enabled: null
  intermediate_size: 1536

  mamba_layers: null

  qk_norm: false

  tie_word_embeddings: true

  vocab_size: 111
  # The dataset's own vocab.json, not a splintr vocabulary.
  tokenizer_vocab: custom

  # Rows are max_seq_len + 1 tokens; this must match the builder's
  # --row-tokens.
  max_seq_len: 128
  rope_theta: 10000.0

  dtype: bf16

trainer:
  target_device: gpu
  learning_rate: 0.0003
  max_steps: 0
  num_epochs: 30

  batch_size: 128
  gradient_accumulation: 1

  shuffle_rows: true

  checkpoint_dir: "${BOOSTR_MODELS_DIR}/g2p_lm/checkpoints/g2p-char"

  # The vocab travels with every checkpoint; the model cannot be read
  # without it.
  checkpoint_sidecars:
    - "${BOOSTR_MODELS_DIR}/g2p_lm/data/vocab.json"

  log_interval: 20
  save_interval: 1596
  max_checkpoints: 10

  load_balance_alpha: 0.0

  max_grad_norm: 1.0
  target_grad_norm: null
  max_grad_value: null

  adamw_beta1: 0.9
  adamw_beta2: 0.95
  adamw_eps: 0.000001
  weight_decay: 0.1
  z_loss_alpha: 0.0

  warmup_steps: null
  warmup_ratio: 0.1
  lr_schedule: cosine
  min_lr_ratio: 0.1

  seed: 42

  # Score phoneme ids (>= target_base) and <eos> (id 3), so the model learns
  # to stop.
  target_mask:
    kind: prefix_lm
    target_base: 61
    always_score: [3]

  # Unused; required by the config parser.
  group_size: 4
  beta_kl: 0.04
