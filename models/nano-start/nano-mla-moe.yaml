# MLA + MoE only (no Mamba) - for gradient comparison with Candle
model:
  name: nano-mla-moe

  hidden_size: 128
  num_layers: 4
  num_heads: 4

  # MLA config
  kv_heads: null
  kv_latent_dim: 64
  q_latent_dim: 64
  d_rope: 8

  # MoE config (same as Candle)
  num_experts: 2
  experts_per_tok: 1
  shared_expert_enabled: true
  intermediate_size: 512

  # NO Mamba layers - all MLA+MoE
  mamba_layers: []

  # Mamba2 config (required by parser but won't be used)
  mamba2_num_heads: 16
  mamba2_head_dim: 16
  mamba2_state_size: 32
  mamba2_chunk_size: 32
  mamba2_n_groups: 1
  mamba2_conv_kernel: 4
  mamba2_expand: 2

  vocab_size: 100315
  tokenizer_vocab: cl100k_base
  max_seq_len: 64
  rope_theta: 10000.0

trainer:
  target_device: gpu
  learning_rate: 0.002
  batch_size: 4
  gradient_accumulation: 2
  max_steps: 0
  num_epochs: 20
  checkpoint_dir: "./checkpoints/nano-mla-moe"
  log_interval: 10
  save_interval: 200
  max_checkpoints: 3
  max_grad_norm: 10.0
  target_grad_norm: null
  max_grad_value: null
  load_balance_alpha: 0.01
  z_loss_alpha: 0.0
  adamw_beta1: 0.9
  adamw_beta2: 0.95
  adamw_eps: 0.000001
  weight_decay: 0.1
  warmup_steps: null
  warmup_ratio: null
  group_size: 4
  beta_kl: 0.04
