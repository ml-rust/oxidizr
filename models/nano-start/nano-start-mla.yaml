# Nano model with ONLY MLA attention (no Mamba2, no MoE) - for testing attention backward
# All 4 layers are pure MLA (no Mamba layers, no MoE)

model:
  name: nano-mla-only

  hidden_size: 128
  num_layers: 4
  num_heads: 4

  # MLA (Multi-Head Latent Attention)
  kv_latent_dim: 64
  q_latent_dim: 64
  d_rope: 8

  # No legacy GQA
  kv_heads: null

  # NO MoE - pure MLP
  num_experts: null
  experts_per_tok: null
  shared_expert_enabled: false
  intermediate_size: 512

  # NO Mamba layers - all attention
  mamba_layers: []

  # Mamba2 config still needed for parser but won't be used
  mamba2_num_heads: 16
  mamba2_head_dim: 16
  mamba2_state_size: 32
  mamba2_chunk_size: 32
  mamba2_n_groups: 1
  mamba2_conv_kernel: 4
  mamba2_expand: 2

  vocab_size: 100315
  tokenizer_vocab: cl100k_base
  max_seq_len: 64
  rope_theta: 10000.0

trainer:
  target_device: gpu
  learning_rate: 0.002
  batch_size: 8
  gradient_accumulation: 2
  max_steps: 0
  num_epochs: 20
  checkpoint_dir: "./checkpoints/nano-start-mla"
  log_interval: 10
  save_interval: 200
  max_checkpoints: 3
  max_grad_norm: 10.0
  target_grad_norm: null
  max_grad_value: null
  load_balance_alpha: 0.0
  z_loss_alpha: 0.0
  adamw_beta1: 0.9
  adamw_beta2: 0.95
  adamw_eps: 0.000001
  weight_decay: 0.1
  warmup_steps: null
  warmup_ratio: null
