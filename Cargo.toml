[package]
name = "oxidizr"
version = "0.1.0"
edition = "2021"
authors = ["Farhan Syah "]
description = "A Rust-based LLM training framework"
license = "Apache-2.0"
repository = "https://github.com/ml-rust/oxidizr"
homepage = "https://github.com/ml-rust/oxidizr"
documentation = "https://github.com/ml-rust/oxidizr/tree/main/docs"
readme = "README.md"
keywords = ["llm", "machine-learning", "transformer", "mamba", "training"]
categories = ["science", "command-line-utilities", "development-tools"]
exclude = [
    "checkpoints/",
    "runs/",
    "tmp/",
    "benchmark/",
    "research/",
    "debug/",
    ".github/",
]

[features]
default = []
# CUDA GPU acceleration (via boostr CubeCL backend)
cuda = ["boostr/cuda"]
# NCCL backend for high-performance multi-GPU gradient synchronization
# Requires NCCL library installed on the system
nccl = ["cuda", "boostr/nccl"]
# HuggingFace Hub integration for model publishing
huggingface = ["dep:hf-hub"]

[dependencies]
# boostr: Complete ML framework replacing Candle
# Provides: Tensor, Device, DType, Linear, Embedding, VarBuilder, etc.
# Also re-exports cubecl_cuda::CudaRuntime when cuda feature is enabled
boostr = { path = "../boostr" }

# Data & Config
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
anyhow = "1.0"
rand = "0.8"
clap = { version = "4.5", features = ["derive"] }

# UI/Logging
indicatif = "0.17"  # For nice progress bars
log = "0.4"
env_logger = "0.11"

# Math
half = "2.4"      # For BF16/FP16 types
chrono = "0.4.42"

# Memory-mapped file I/O
memmap2 = "0.9"

# Environment and interactive CLI
dotenvy = "0.15"
dialoguer = "0.11"

# HuggingFace Hub (optional, for model publishing)
hf-hub = { version = "0.4", optional = true }
