[package]
name = "oxidizr"
version = "0.1.0"
edition = "2021"
authors = ["Farhan Syah "]
description = "LLM training framework in Rust: train Transformer, Mamba, MLA and MoE models from a YAML config, with no Python"
license = "Apache-2.0"
repository = "https://github.com/ml-rust/oxidizr"
homepage = "https://github.com/ml-rust/oxidizr"
documentation = "https://github.com/ml-rust/oxidizr/tree/main/docs"
readme = "README.md"
keywords = ["llm", "machine-learning", "transformer", "mamba", "training"]
categories = ["science", "command-line-utilities", "development-tools"]
exclude = [
    "checkpoints/",
    "runs/",
    "tmp/",
    "benchmark/",
    "research/",
    "debug/",
    ".github/",
]

[features]
# `f16` is on by default: `DTypePrecision` offers F16 and BF16 unconditionally,
# so without it a `dtype: bf16` config parses, validates, builds a model, and
# then dies inside the first op with "Unsupported dtype BF16". Half precision is
# not optional for training a modern LLM — a 1.7B model in f32 does not fit on a
# consumer GPU once AdamW's two moment buffers are counted.
default = ["f16"]
# Half-precision (F16 / BF16) dtype support.
f16 = ["boostr/f16"]
# CUDA GPU acceleration (via boostr CubeCL backend). NVML reports GPU memory;
# it loads libnvidia-ml at run time, so the build needs no NVIDIA library.
cuda = ["boostr/cuda", "dep:nvml-wrapper"]
# TensorBoard event files of the training scalars in the run directory.
tensorboard = []
# Multi-GPU data parallelism over NCCL (boostr/nccl).
nccl = ["cuda", "boostr/nccl"]
# HuggingFace Hub integration for model publishing
huggingface = ["dep:hf-hub"]

# Speech corpus preparation: the `prep-corpus` command, which needs
# voxr's corpus pipeline and the boostr models behind it (VAD,
# Whisper, NeuCodec). Off by default — a text-only training build has no use
# for four codec decoders and the audio pipelines. The boostr model gates are
# listed too because the command imports those types from boostr directly.
#
# The layout sidecar (`speech_corpus`) is NOT gated: a text-only build still
# has to read `foo.layout.json` to refuse a speech corpus packed under a
# different layout, and that code is pure JSON with no audio dependency.
audio = [
  "dep:voxr",
  "voxr/corpus",
  "boostr/whisper",
  "boostr/silero-vad",
  "boostr/neucodec",
]

# Bundled tokenizer vocabularies, forwarded to boostr and on to splintr. These
# are what make `tokenize --tokenizer <name>` and
# `prep-corpus --tokenizer <name>` work for a name: the
# vocabulary DATA is feature-gated (2.6-6.4 MB per family) and none is bundled
# by default. `--tokenizer <path-to-tokenizer.json>` needs none of them, and is
# the better choice for a real checkpoint because it carries its added tokens.
vocab-cl100k = ["boostr/vocab-cl100k"]
vocab-o200k = ["boostr/vocab-o200k"]
vocab-gpt-oss = ["boostr/vocab-gpt-oss"]
vocab-phi4 = ["boostr/vocab-phi4"]
vocab-olmo2 = ["boostr/vocab-olmo2"]
vocab-llama3 = ["boostr/vocab-llama3"]
vocab-llama2 = ["boostr/vocab-llama2"]
vocab-deepseek = ["boostr/vocab-deepseek"]
vocab-qwen = ["boostr/vocab-qwen"]
vocab-glm = ["boostr/vocab-glm"]
vocab-gemma2 = ["boostr/vocab-gemma2"]
vocab-gemma3 = ["boostr/vocab-gemma3"]
vocab-gemma4 = ["boostr/vocab-gemma4"]
vocab-kimi = ["boostr/vocab-kimi"]
vocab-mistral = ["boostr/vocab-mistral"]
vocab-modernbert = ["boostr/vocab-modernbert"]
# Every bundled vocabulary at once.
vocabs = ["boostr/vocabs"]

[dependencies]
# boostr: Complete ML framework replacing Candle
# Provides: Tensor, Device, DType, Linear, Embedding, VarBuilder, etc.
# Also re-exports cubecl_cuda::CudaRuntime when cuda feature is enabled
boostr = "0.10"
# Text tokenizers for `oxidizr tokenize` and `--tokenizer`. The same crate and
# requirement boostr declares, so the `vocab-*` features above reach it too.
splintr = "0.22"
# Sample-level audio: decode, enhancement, and the speech-corpus builder.
voxr = { version = "0.8", optional = true }

# Data & Config
serde = { version = "1.0", features = ["derive"] }
# `float_roundtrip` parses every f64 back to its exact bits. The spike guard's
# EMA state in a checkpoint meta must resume bit-identical.
serde_json = { version = "1.0", features = ["float_roundtrip"] }
serde_yaml = "0.9"
anyhow = "1.0"
rand = "0.8"
clap = { version = "4.5", features = ["derive"] }

# UI/Logging
indicatif = "0.17"  # For nice progress bars
log = "0.4"
env_logger = "0.11"

# Math
half = "2.4"      # For BF16/FP16 types
chrono = "0.4.42"

# Memory-mapped file I/O
memmap2 = "0.9"

# Environment and interactive CLI
dotenvy = "0.15"
dialoguer = "0.11"

# NVML bindings for GPU memory (optional, `cuda`). The library loads at run
# time, and a missing driver reads as "unavailable".
nvml-wrapper = { version = "0.13", optional = true }

# HuggingFace Hub (optional, for model publishing)
hf-hub = { version = "0.4", optional = true }
